name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
            triplet: x64-windows
            vcpkg-root: C:\vcpkg
            compiler-flags: ""
          - os: windows-latest
            compiler: clang
            triplet: x64-windows
            vcpkg-root: C:\vcpkg
            compiler-flags: -T ClangCL
          - os: ubuntu-latest
            compiler: gcc
            triplet: x64-linux
            vcpkg-root: /usr/local/share/vcpkg
            compiler-flags: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - os: ubuntu-latest
            compiler: clang
            triplet: x64-linux
            vcpkg-root: /usr/local/share/vcpkg
            compiler-flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    name: ${{ matrix.os }} (${{ matrix.compiler }})

    runs-on: ${{ matrix.os }}

    env:
      VCPKG_ROOT: ${{ matrix.vcpkg-root }}

    steps:
      - uses: actions/checkout@v4

      # ── Vulkan SDK (Windows) ──────────────────────────────────────────
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.4.341.1"
          $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan_sdk.exe" `
            -OutFile $installer
          Start-Process -FilePath $installer `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow
          $sdkPath = "C:\VulkanSDK\$ver"
          echo "VULKAN_SDK=$sdkPath"           >> $env:GITHUB_ENV
          echo "$sdkPath\Bin"                  >> $env:GITHUB_PATH

      # ── Vulkan SDK + dev headers (Linux) ──────────────────────────────
      - name: Install Vulkan SDK and dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          # autoconf/automake/libtool: vcpkg builds the X11/xcb ports
          # (e.g. pthread-stubs) from source with autotools.
          sudo apt-get install -y vulkan-sdk \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            pkg-config build-essential \
            autoconf autoconf-archive automake libtool

      # ── vcpkg cache ──────────────────────────────────────────────────
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: build/vcpkg_installed
          key: vcpkg-${{ matrix.os }}-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ matrix.compiler }}-

      # ── Build ─────────────────────────────────────────────────────────
      - name: CMake configure
        run: >
          cmake -B build -S .
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.vcpkg-root }}/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DCMAKE_BUILD_TYPE=Release
          -DVW_PORTABLE=ON
          ${{ matrix.compiler-flags }}

      - name: CMake build
        run: cmake --build build --config Release

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist
